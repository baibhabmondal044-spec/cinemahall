<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Cinema Hall - 360° View</title>
<style>
  :root{--ui-bg:rgba(15,15,20,.7);--ui-fg:#f2f2f5;--ui-line:rgba(255,255,255,.2)}
  html,body{height:100%;margin:0;background:#07070a;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
  #ui button{pointer-events:auto;background:var(--ui-bg);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
  #ui button:hover,#ui button.on{background:#c0392b;border-color:#c0392b}
  #hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:var(--ui-fg);background:var(--ui-bg);border:1px solid var(--ui-line);padding:8px 14px;border-radius:12px;font-size:13px;text-align:center;pointer-events:none;max-width:92vw}
</style>
</head>
<body>
<div id="hint">Drag to look 360° · Scroll/pinch to zoom · W A S D / arrows to walk</div>
<div id="ui">
  <button data-v="aisle">Aisle view</button>
  <button data-v="back">Projector side</button>
  <button data-v="front">Facing seats</button>
  <button id="spin">Auto-rotate</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);
scene.fog = new THREE.Fog(0x050507, 14, 30);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 60);
camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const std = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.8, metalness:.05}, o));
const box = (w,h,d,m,x,y,z,p) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); b.position.set(x,y,z); (p||scene).add(b); return b; };

// ---------- Room (x: -6..6, z: -8..8, ceiling 6) ----------
const W=12, D=16, H=6;
box(W,0.1,D, std(0x3a0f16,{roughness:1}), 0,-0.05,0);              // carpet
box(W,0.1,D, std(0x0b0b10), 0,H+0.05,0);                           // ceiling
const wallM = std(0x1a1a24);
box(W,H,0.2, wallM, 0,H/2,-D/2);                                   // front wall
box(W,H,0.2, wallM, 0,H/2, D/2);                                   // back wall
box(0.2,H,D, wallM, -W/2,H/2,0);                                   // left wall
box(0.2,H,D, wallM,  W/2,H/2,0);                                   // right wall

// Acoustic panels on side walls
const panelM = std(0x2b1f2e,{roughness:1});
for(let i=0;i<10;i++){ const z=-7+i*1.55;
  box(0.12,3.4,1.0, panelM, -W/2+0.16,2.6,z);
  box(0.12,3.4,1.0, panelM,  W/2-0.16,2.6,z);
}
// Wall base trim lights
const glow = c => new THREE.MeshBasicMaterial({color:c});
box(0.05,0.05,D-0.4, glow(0xffb36b), -W/2+0.12,0.9,0);
box(0.05,0.05,D-0.4, glow(0xffb36b),  W/2-0.12,0.9,0);

// Ceiling star lights
const starM = glow(0xfff1d0);
for(let x=-4.5;x<=4.5;x+=1.5) for(let z=-6;z<=7;z+=1.6){
  const s = new THREE.Mesh(new THREE.CircleGeometry(0.06,12), starM);
  s.rotation.x = Math.PI/2; s.position.set(x,H-0.01,z); scene.add(s);
}

// ---------- Screen ----------
const c = document.createElement('canvas'); c.width=1024; c.height=440;
const g = c.getContext('2d');
const grad = g.createLinearGradient(0,0,1024,440);
grad.addColorStop(0,'#1b2a6b'); grad.addColorStop(.5,'#7b2d8e'); grad.addColorStop(1,'#e8613c');
g.fillStyle = grad; g.fillRect(0,0,1024,440);
g.fillStyle='rgba(255,255,255,.92)'; g.textAlign='center';
g.font='bold 92px Georgia, serif'; g.fillText('NOW SHOWING', 512, 220);
g.font='34px system-ui, sans-serif'; g.fillText('Welcome to the Grand Recliner Cinema', 512, 290);
const screenTex = new THREE.CanvasTexture(c);
const SW=9.6, SH=4.1, SY=3.3, SZ=-D/2+0.2;
box(SW+0.5,SH+0.5,0.12, std(0x000000), 0,SY,SZ-0.02);            // frame
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SW,SH), new THREE.MeshBasicMaterial({map:screenTex}));
screen.position.set(0,SY,SZ+0.06); scene.add(screen);
box(W-1,0.12,0.7, std(0x120a0c), 0,0.06,SZ+0.45);                  // stage lip

// ---------- Stepped seating platforms ----------
const rowZ = [-2, 0.6, 3.2], stepH = 0.3;
const stepM = std(0x24141a,{roughness:1});
rowZ.forEach((z,i)=>{
  const front = z-1.3, back = i===2 ? D/2-0.1 : z+1.3;
  const h = (i+1)*stepH;
  box(W-0.2, h, back-front, stepM, 0, h/2, (front+back)/2);
  box(W-0.6, 0.04, 0.04, glow(0xff5a3c), 0, h-0.1, front+0.03);   // step light strip
});

// ---------- Recliner seat ----------
const leather = std(0x7a1220,{roughness:.45, metalness:.1});
const leatherD = std(0x4d0c15,{roughness:.5});
const metal = std(0x222226,{roughness:.3, metalness:.8});
const cup = glow(0x4aa8ff);
function recliner(){
  const s = new THREE.Group();
  box(0.7,0.18,0.7, metal, 0,0.14,0, s);                           // base
  box(0.82,0.22,0.78, leather, 0,0.38,0, s);                       // seat cushion
  const back = box(0.82,1.0,0.22, leather, 0,0.98,0.42, s);        // backrest
  back.rotation.x = 0.28;
  const head = box(0.5,0.28,0.16, leatherD, 0,1.55,0.56, s);       // headrest
  head.rotation.x = 0.28;
  [-1,1].forEach(k=>{
    box(0.16,0.5,0.82, leatherD, k*0.5,0.5,0.02, s);               // armrests
    box(0.18,0.06,0.84, leather, k*0.5,0.78,0.02, s);
  });
  const foot = box(0.7,0.1,0.5, leather, 0,0.3,-0.55, s);          // footrest
  foot.rotation.x = -0.18;
  box(0.08,0.02,0.08, cup, 0.5,0.82,-0.15, s);                     // cup-holder glow
  return s;
}
const seatX = [-4.4,-3.15,-1.9, 1.9,3.15,4.4];
rowZ.forEach((z,i)=>{
  const y = (i+1)*stepH;
  seatX.forEach(x=>{ const r = recliner(); r.position.set(x,y,z); scene.add(r); });
});

// ---------- Projector (mounted on ceiling, behind all seats) ----------
const PZ = 6.3, PY = 5.35;
const pg = new THREE.Group(); pg.position.set(0,PY,PZ); scene.add(pg);
box(0.1,0.6,0.1, metal, 0,0.45,0, pg);                              // ceiling rod
box(0.5,0.05,0.5, metal, 0,0.72,0, pg);
box(0.9,0.34,0.7, std(0xd8d8de,{roughness:.35,metalness:.3}), 0,0,0, pg); // body
box(0.92,0.04,0.72, std(0x15151a), 0,0.19,0, pg);
box(0.5,0.02,0.3, std(0x15151a), 0,-0.18,0.1, pg);                 // vent
const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.17,0.3,24), std(0x111114,{metalness:.9,roughness:.2}));
lens.rotation.x = Math.PI/2; lens.position.set(0,0,-0.45); pg.add(lens);
const lensGlass = new THREE.Mesh(new THREE.CircleGeometry(0.12,24), glow(0xcfe6ff));
lensGlass.rotation.y = Math.PI; lensGlass.position.set(0,0,-0.61); pg.add(lensGlass);
const led = new THREE.Mesh(new THREE.SphereGeometry(0.025,8,8), glow(0x38ff7a)); led.position.set(0.35,0.1,-0.36); pg.add(led);

// Light beam from projector to screen
const from = new THREE.Vector3(0,PY,PZ-0.6), to = new THREE.Vector3(0,SY,SZ+0.06);
const dir = to.clone().sub(from), L = dir.length();
const coneG = new THREE.ConeGeometry(SW*0.52, L, 32, 1, true); coneG.translate(0,-L/2,0);
const beam = new THREE.Mesh(coneG, new THREE.MeshBasicMaterial({color:0xb8ccff,transparent:true,opacity:0.045,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
beam.position.copy(from); beam.scale.z = SH/SW;
beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
scene.add(beam);

// Projection booth window on back wall
box(2.2,0.9,0.1, std(0x000000), 0,4.4,D/2-0.12);
box(2.3,0.04,0.12, glow(0xffb36b), 0,4.88,D/2-0.12);

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0x6a6a88, 0.55));
scene.add(new THREE.HemisphereLight(0x8899ff, 0x301018, 0.35));
const sl = new THREE.PointLight(0x9a8cff, 1.4, 22); sl.position.set(0,3.3,-6.2); scene.add(sl);  // screen glow
const sl2 = new THREE.PointLight(0xffa860, 0.8, 14); sl2.position.set(0,5.5,0); scene.add(sl2);
[-1,1].forEach(k=>{ const p=new THREE.PointLight(0xffb36b,0.6,9); p.position.set(k*5.5,1.2,1); scene.add(p); });

// ---------- Camera / controls ----------
let yaw=0, pitch=0, pos=new THREE.Vector3(0,1.9,0.6), spin=false;
const views = {
  aisle:{p:[0,1.9,0.6], yaw:0},
  back: {p:[0,1.5+0.9,7.4], yaw:0},
  front:{p:[0,1.6,-5.3], yaw:Math.PI}
};
function setView(n){ const v=views[n]; pos.set(...v.p); yaw=v.yaw; pitch=0; camera.fov=70; camera.updateProjectionMatrix(); }
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const spinBtn = document.getElementById('spin');
spinBtn.onclick=()=>{ spin=!spin; spinBtn.classList.toggle('on',spin); };

const el = renderer.domElement; let drag=false, lx=0, ly=0;
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointerup',()=>drag=false);
el.addEventListener('pointermove',e=>{
  if(!drag) return;
  const k = camera.fov/70*0.005;
  yaw -= (e.clientX-lx)*k; pitch -= (e.clientY-ly)*k;
  pitch = Math.max(-1.45,Math.min(1.45,pitch)); lx=e.clientX; ly=e.clientY;
});
el.addEventListener('wheel',e=>{
  e.preventDefault();
  camera.fov = Math.max(30,Math.min(100,camera.fov+e.deltaY*0.04)); camera.updateProjectionMatrix();
},{passive:false});
const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function floorY(z){
  if(z<-3.3) return 0;
  const i = Math.min(2, Math.floor((z+3.3)/2.6));
  return (i+1)*stepH;
}

const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(),0.05), sp = 3*dt;
  let f=0, s=0;
  if(keys['w']||keys['arrowup']) f+=1;
  if(keys['s']||keys['arrowdown']) f-=1;
  if(keys['d']||keys['arrowright']) s+=1;
  if(keys['a']||keys['arrowleft']) s-=1;
  if(f||s){
    pos.x += (-Math.sin(yaw)*f + Math.cos(yaw)*s)*sp;
    pos.z += (-Math.cos(yaw)*f - Math.sin(yaw)*s)*sp;
    pos.x = Math.max(-5.5,Math.min(5.5,pos.x)); pos.z = Math.max(-6.8,Math.min(7.6,pos.z));
    pos.y = floorY(pos.z) + 1.6;
  }
  if(spin) yaw += 0.35*dt;
  camera.position.copy(pos);
  camera.rotation.set(pitch,yaw,0);
  led.visible = Math.floor(clock.elapsedTime*2)%2===0;
  beam.material.opacity = 0.04 + 0.012*Math.sin(clock.elapsedTime*3);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
setView('aisle'); loop();
</script>
</body>
</html>
